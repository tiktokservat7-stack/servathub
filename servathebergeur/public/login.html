<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — servathub</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="auth-back" href="/">← Retour à l'accueil</a>
    <a class="brand" href="/"><span class="dot"></span>servathub</a>
    <h1>Content de te revoir</h1>
    <p class="auth-sub">Connecte-toi pour gérer tes sites.</p>
    <div class="form-error" id="error"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input class="input" type="email" id="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input class="input" type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" id="submit">Se connecter</button>
    </form>
    <p class="auth-switch">Pas encore de compte ? <a href="/signup">Créer un compte gratuit</a></p>
  </div>
</div>
<script src="/app/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('error');
    clearError(err);
    const btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Connexion…';
    try {
      await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      location.href = '/dashboard';
    } catch (ex) {
      showError(err, ex.message);
      btn.disabled = false; btn.textContent = 'Se connecter';
    }
  });
</script>
</body>
</html>
